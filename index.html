${again.length?row("Order again",again):""}${row("Popular right now",pop)}${row("₱30 and under",cheap)}`};

<div class="c"><h2>🏫 Campus layout</h2><div class="cols2"><div>${map(S.grade,"none")}</div><ul style="padding-left:18px;margin:0"><li><b>Grade 7 Building</b>: its bottom floor is the <b>Main Gate</b>.</li><li><b>SHS</b>: Senior High School building.</li><li><b>JHS</b>: Junior High School building.</li><li><b>Canteen</b>: right beside JHS.</li><li><b>Open Stage</b>: right beside the Canteen.</li></ul></div><a class="btn" href="${S.user?"#/menu":"#/login"}">Try it now</a></div>`};

const NV=[["home","Home"],["menu","Menu"],["orders","Orders"],["profile","Profile"]];
const onk=r=>({home:"home",menu:"menu",item:"menu",cart:"menu",checkout:"menu",orders:"orders",track:"orders",receive:"orders",done:"orders",profile:"profile"}[r]);
const icn=(k,s)=>I(k=="home"?"home":k=="menu"?"menu":k=="orders"?"orders":"user",s);
function topBar(r){return `<div class="top"><a class="b" href="${S.user?"#/home":"#/"}"><img src="logo.png" alt="">MCPI Canteen</a>${S.user?`<div class="dn">${NV.map(([k,l])=>`<a href="#/${k}" class="${onk(r)==k?"on":""}">${icn(k,20)}${l}</a>`).join("")}</div>`:""}${fsBtn()}${themeBtn()}${S.user?`<a class="ib" href="#/cart" aria-label="Cart">${I("cart")}${cartN()?`<span class="bd">${cartN()}</span>`:""}</a>`:""}</div>`}
function nav(r){return `<div class="bn">${NV.map(([k,l])=>`<a href="#/${k}" class="${onk(r)==k?"on":""}">${icn(k,22)}${l}</a>`).join("")}</div>`}
function go(){clearInterval(timer);closeSheet();
 const h=(location.hash||"#/").slice(2).split("/"),r=R[h[0]]?h[0]:"welcome";
 if(!S.user&&!["welcome","login","guide","staff"].includes(r)){location.hash="#/login";return}
 if(S.user&&(r=="welcome"||r=="login")){location.hash="#/home";return}
 const full=r=="welcome"||r=="login",st=r=="staff";let html=R[r](h[1]);
 if(!full&&!st)html=topBar(r)+`<div class="pad">${html}<footer class="ft">Maryknoll College of Panabo, Inc. · Capstone demo · No real payments</footer></div>`;
 if(S.user&&!full&&!st){if((r=="home"||r=="menu")&&cartN())html+=`<div class="fl"><span><b>${cartN()} item${cartN()>1?"s":""}</b><br>${peso(cartT())}</span><a class="btn w sm" href="#/cart">View cart ${I("arrow",16)}</a></div>`;html+=nav(r)}
 A.className="phone"+(full||st?" full":"");A.innerHTML=html;hsAll();setTimeout(hsAll,300);
 if(r=="track"){const o=cur();if(o&&o.st<2)timer=setInterval(adv,8000)}
 if(location.hash!=lastH){scrollTo(0,0);lastH=location.hash}}
function login(d){let n=d?"Demo Student":$("nm").value.trim();if(!n){alert("Please type your name.");$("nm").focus();return}
 S.user=n;S.grade=+$("gr").value;S.sid=d?"":$("sid").value.trim();S.rn=cleanRn($("rm").value)||(d?"204":"");syncRoom();save();location.hash="#/home"}
function logout(){S={user:"",grade:S.grade,sid:"",room:S.room,rn:S.rn,cart:{},orders:S.orders,count:S.count};save();location.hash="#/"}
function resetDemo(){if(confirm("Clear all demo orders and restart numbering at MCPI-001?")){S.orders=[];S.cart={};S.count=0;save();go()}}
function setMode(m){mode=m;keep()}
function add(id){S.cart[id]=1;save();toast(item(id).n+" added to cart");go()}
function chg(id,d){const n=(S.cart[id]||0)+d;if(n<=0)delete S.cart[id];else S.cart[id]=n;save();go()}
function place(){if(mode=="delivery"&&!S.rn){const r=$("coR");if(r){r.classList.add("inerr");r.focus()}toast("Please type your room number");return}
 S.count++;S.orders.push({no:"MCPI-"+String(S.count).padStart(3,"0"),name:S.user,grade:S.grade,mode:mode,room:mode=="delivery"?S.room:"",items:Object.entries(S.cart).map(([i,n])=>({...item(i),q:n})),total:cartT(),time:pick,notes:note,st:0,acc:false});S.cart={};note="";save();location.hash="#/done"}
function adv(){const o=cur();if(o&&o.st<3){o.st++;if(o.st>0)o.acc=true;save();go()}}
function done(){cur().st=3;save();go()}
function sa(no){const o=S.orders.find(x=>x.no==no);if(o.st==0&&!o.acc)o.acc=true;else if(o.st<3)o.st++;save();go()}
addEventListener("resize",hsAll);addEventListener("hashchange",go);addEventListener("storage",e=>{if(e.key=="mcpi"){load();go()}});go();
</script></body></html>
